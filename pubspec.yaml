name: clean_architecture_template
description: "Flutter project template"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.3

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # DI
  get_it: ^8.0.3


  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Functional Programming
  dartz: ^0.10.1

  # Routing
  go_router: ^14.6.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Date/Time
  intl: ^0.20.2

  # UI Helpers
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
